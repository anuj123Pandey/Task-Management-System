
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">T</div>
                <h2>TaskFlow</h2>
            </div>

            <p class="sidebar-label">MENU</p>

            <nav class="sidebar-nav">
                <a href="#overview" class="nav-link active">
                    <span>▦</span> Dashboard
                </a>

                <a href="#addTaskSection" class="nav-link">
                    <span>＋</span> Add New Task
                </a>

                <a href="#taskSection" class="nav-link">
                    <span>☷</span> My Tasks
                </a>
            </nav>

            <div class="sidebar-bottom">
                <p>Stay focused. Get things done.</p>
                <button id="logoutBtn" class="logout-btn">
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Header -->
            <header class="top-header" id="overview">
                <div>
                    <p class="eyebrow">WORKSPACE</p>
                    <h1>Dashboard</h1>
                    <p id="welcome">Welcome!</p>
                </div>

                <div class="profile-avatar">U</div>
            </header>

            <!-- Statistics -->
            <section class="stats-grid">

                <div class="stat-card">
                    <div class="stat-icon total-icon">☷</div>
                    <p>Total Tasks</p>
                    <h2 id="totalTasks">0</h2>
                </div>

                <div class="stat-card">
                    <div class="stat-icon completed-icon">✓</div>
                    <p>Completed</p>
                    <h2 id="completedTasks">0</h2>
                </div>

                <div class="stat-card">
                    <div class="stat-icon pending-icon">◷</div>
                    <p>Pending</p>
                    <h2 id="pendingTasks">0</h2>
                </div>

            </section>

            <!-- Add Task -->
            <section class="content-card" id="addTaskSection">

                <div class="section-heading">
                    <div>
                        <p class="eyebrow">GET STARTED</p>
                        <h2>Create a New Task</h2>
                    </div>
                </div>

                <form id="taskForm" class="task-form">

                    <div class="form-group">
                        <label for="title">Task Title</label>
                        <input
                            type="text"
                            id="title"
                            placeholder="What do you need to do?"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            placeholder="Add some details about your task..."
                        ></textarea>
                    </div>

                    <button type="submit" class="add-task-btn">
                        + Add Task
                    </button>

                </form>

            </section>

            <!-- Task List -->
            <section class="content-card" id="taskSection">

                <div class="section-heading">
                    <div>
                        <p class="eyebrow">YOUR WORK</p>
                        <h2>My Tasks</h2>
                    </div>
                </div>

                <div id="tasksContainer" class="tasks-container">
                    Loading tasks...
                </div>

            </section>

            <footer class="dashboard-footer">
                Made to help you stay productive.
            </footer>

        </main>
    </div>

    <script src="js/dashboard.js"></script>

</body>
</html>
